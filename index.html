<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>考研政治 · 32核心会议 + 25篇毛选著作抽签器</title>
  <style>
    /* ==========================================================================
       1. 温润纸质感极简学术设计系统 (Design Tokens)
       ========================================================================== */
    :root {
      /* 纸质背景与深墨层次 */
      --bg-paper: #F7F5F0;
      --bg-card: #FFFFFF;
      --bg-subtle: #ECE9E1;
      --bg-hover: #E3DFD5;
      --ink: #1E242B;
      --ink-secondary: #4B5563;
      --ink-muted: #78828E;
      --ink-light: #A0A8B0;

      /* 会议朱砂红主题 */
      --meeting: #B83B2A;
      --meeting-dark: #942C1E;
      --meeting-soft: #FDF2F0;
      --meeting-border: rgba(184, 59, 42, 0.24);

      /* 毛选黛青/墨绿主题 */
      --work: #1D6353;
      --work-dark: #144B3E;
      --work-soft: #EEF6F4;
      --work-border: rgba(29, 99, 83, 0.24);

      /* 陷阱柔和琥珀主题 */
      --trap-bg: #FDF6E7;
      --trap-border: rgba(196, 134, 34, 0.34);
      --trap-ink: #7A4F0B;
      --trap-accent: #C48622;

      /* 学术藏青主色 */
      --navy: #223A59;
      --navy-dark: #172940;
      --navy-soft: #EEF3F8;
      --navy-border: rgba(34, 58, 89, 0.2);

      /* 边框与阴影 */
      --border: #E2DDD3;
      --shadow-sm: 0 2px 6px rgba(30, 36, 43, 0.04);
      --shadow-md: 0 12px 30px rgba(30, 36, 43, 0.07);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 18px;

      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      --font-serif: "Songti SC", "STSong", "Noto Serif SC", Georgia, serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background-color: var(--bg-paper);
      color: var(--ink);
      font-family: var(--font-sans);
      line-height: 1.56;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      outline: none;
      color: inherit;
      transition: transform 0.12s ease, background-color 0.18s ease, border-color 0.18s ease, opacity 0.18s ease;
    }

    button:active:not(:disabled) {
      transform: scale(0.97);
    }

    button:disabled {
      cursor: not-allowed;
    }

    /* ==========================================================================
       2. 主容器 & 沉浸专注模式 (Zen Mode)
       ========================================================================== */
    .app-container {
      max-width: 700px;
      margin: 0 auto;
      padding: 12px 14px 20px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    body.zen-mode .zen-hide {
      display: none !important;
    }

    .zen-exit-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 6px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px;
      box-shadow: var(--shadow-sm);
    }

    body.zen-mode .zen-exit-bar {
      display: flex;
    }

    /* ==========================================================================
       3. 顶部栏：品牌 + 番茄钟 + 专注按钮
       ========================================================================== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .brand-seal {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--meeting) 0%, var(--navy) 100%);
      color: #FFFFFF;
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      letter-spacing: -0.5px;
    }

    .brand-title {
      margin: 0;
      font-size: 15.5px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 0.2px;
    }

    .brand-sub {
      margin: 0;
      font-size: 11px;
      color: var(--ink-muted);
    }

    .header-tools {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .pomo-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-secondary);
      box-shadow: var(--shadow-sm);
    }

    .pomo-pill.running {
      border-color: var(--meeting-border);
      background: var(--meeting-soft);
      color: var(--meeting);
    }

    .pomo-time {
      font-family: var(--font-mono);
      font-size: 12.5px;
      font-weight: 700;
      min-width: 40px;
      text-align: center;
    }

    .pomo-btn {
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      background: var(--bg-subtle);
      color: var(--ink);
    }

    .pomo-btn:hover { background: var(--bg-hover); }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink-secondary);
      box-shadow: var(--shadow-sm);
      white-space: nowrap;
    }

    .pill-btn.active-navy {
      background: var(--navy-soft);
      border-color: var(--navy-border);
      color: var(--navy);
    }

    .pill-btn.active-meeting {
      background: var(--meeting-soft);
      border-color: var(--meeting-border);
      color: var(--meeting);
    }

    .pill-btn.active-work {
      background: var(--work-soft);
      border-color: var(--work-border);
      color: var(--work);
    }

    .pill-btn.active-trap {
      background: var(--trap-bg);
      border-color: var(--trap-border);
      color: var(--trap-ink);
    }

    /* ==========================================================================
       4. 板块筛选胶囊 + 三大模式导航 + 工具条 + 状态栏
       ========================================================================== */
    .scope-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }

    .scope-btn {
      padding: 7px 6px;
      border-radius: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      box-shadow: var(--shadow-sm);
    }

    .scope-btn .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .scope-btn[data-scope="all"].active {
      background: var(--navy);
      border-color: var(--navy);
      color: #FFFFFF;
    }

    .scope-btn[data-scope="meeting"].active {
      background: var(--meeting);
      border-color: var(--meeting);
      color: #FFFFFF;
    }

    .scope-btn[data-scope="work"].active {
      background: var(--work);
      border-color: var(--work);
      color: #FFFFFF;
    }

    .scope-btn.active .dot {
      background: #FFFFFF !important;
    }

    .mode-switcher {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--bg-subtle);
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      margin-bottom: 8px;
      gap: 4px;
    }

    .mode-tab {
      padding: 6px 4px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-secondary);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }

    .mode-tab span.sub {
      font-size: 10px;
      font-weight: 400;
      color: var(--ink-muted);
    }

    .mode-tab.active {
      background: var(--bg-card);
      color: var(--navy);
      box-shadow: var(--shadow-sm);
    }

    .mode-tab.active span.sub { color: var(--ink-secondary); }

    .toolbar-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .toolbar-left, .toolbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 7px 12px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      flex-wrap: wrap;
    }

    .status-metrics {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .metric {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink);
    }

    .metric .lbl {
      font-size: 11px;
      font-weight: 400;
      color: var(--ink-muted);
    }

    .metric.navy strong { color: var(--navy); }
    .metric.meeting strong { color: var(--meeting); }
    .metric.work strong { color: var(--work); }
    .metric.trap strong { color: var(--trap-accent); }

    .btn-mini {
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      background: var(--bg-subtle);
      color: var(--ink);
    }

    .btn-mini:hover { background: var(--bg-hover); }
    .btn-mini.danger { color: var(--meeting); background: var(--meeting-soft); }

    /* ==========================================================================
       5. 零穿透 3D 翻面签卡 (四重同步切换，彻底兼容 iOS Safari)
       ========================================================================== */
    .stage-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 410px;
      margin-bottom: 14px;
      width: 100%;
    }

    .lot-scene {
      width: 100%;
      height: clamp(415px, 57dvh, 535px);
      position: relative;
      perspective: 1400px;
      user-select: none;
    }

    @keyframes drawEnter {
      0% { transform: translateY(14px) scale(0.97); opacity: 0.45; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    .lot-scene.drawing-anim {
      animation: drawEnter 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .lot-card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.44s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .lot-card.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    /* 四重同步切换：在 0.44s 翻转中点 (0.21s) 瞬间完成可见性与层级切换，杜绝穿透重影 */
    .card-front {
      transform: rotateY(0deg);
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      z-index: 2;
      transition: opacity 0.01s linear 0.21s, visibility 0.01s linear 0.21s, z-index 0.01s linear 0.21s;
      padding: 20px 22px;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      cursor: pointer;
    }

    .card-back {
      transform: rotateY(180deg);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      z-index: 0;
      transition: opacity 0.01s linear 0.21s, visibility 0.01s linear 0.21s, z-index 0.01s linear 0.21s;
      padding: 0;
      text-align: left;
    }

    .lot-card.is-flipped .card-front {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .lot-card.is-flipped .card-back {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      z-index: 2;
    }

    /* 正面视觉锚点：极简留白，只展示年份 + 名称 + 极淡类型微标 */
    .card-top-meta {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 24px;
    }

    .type-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .type-badge.meeting {
      background: var(--meeting-soft);
      color: var(--meeting);
      border: 1px solid var(--meeting-border);
    }

    .type-badge.work {
      background: var(--work-soft);
      color: var(--work);
      border: 1px solid var(--work-border);
    }

    .type-badge.blind {
      background: var(--bg-subtle);
      color: var(--ink-muted);
      border: 1px solid var(--border);
    }

    .priority-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: var(--meeting-soft);
      color: var(--meeting);
      border: 1px solid var(--meeting-border);
    }

    .lot-counter {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink-muted);
    }

    .front-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px 6px;
    }

    .year-anchor {
      font-family: var(--font-mono);
      font-size: clamp(40px, 10vw, 54px);
      font-weight: 800;
      letter-spacing: 1.5px;
      line-height: 1.05;
      margin-bottom: 14px;
    }

    .year-anchor.meeting { color: var(--meeting); }
    .year-anchor.work { color: var(--work); }
    .year-anchor.blind { color: var(--navy); }

    .meeting-name-front {
      margin: 0;
      font-family: var(--font-serif);
      font-size: clamp(21px, 5.4vw, 28px);
      font-weight: 700;
      color: var(--ink);
      line-height: 1.38;
      max-width: 94%;
    }

    .front-divider {
      width: 38px;
      height: 2px;
      background: var(--border);
      margin: 18px 0 12px;
      border-radius: 2px;
    }

    .front-group-hint {
      font-size: 12px;
      color: var(--ink-muted);
    }

    .flip-hint {
      font-size: 12px;
      color: var(--ink-muted);
      background: var(--bg-paper);
      border: 1px solid var(--border);
      padding: 6px 15px;
      border-radius: 999px;
    }

    /* ==========================================================================
       6. 背面三层考点 + 核心标签 + 时间链 + 随堂判断题
       ========================================================================== */
    .back-header {
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
      background: #FAF9F5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .back-title-wrap {
      display: flex;
      align-items: baseline;
      gap: 7px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .back-year {
      font-family: var(--font-mono);
      font-size: 13.5px;
      font-weight: 800;
    }

    .back-year.meeting { color: var(--meeting); }
    .back-year.work { color: var(--work); }

    .back-name {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.3;
    }

    .back-body {
      flex: 1;
      padding: 12px 16px 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .anchor-tag-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 11px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 700;
      flex-wrap: wrap;
    }

    .anchor-tag-bar.meeting {
      background: var(--meeting-soft);
      color: var(--meeting-dark);
      border: 1px solid var(--meeting-border);
    }

    .anchor-tag-bar.work {
      background: var(--work-soft);
      color: var(--work-dark);
      border: 1px solid var(--work-border);
    }

    .layer-box {
      border-radius: 10px;
      padding: 9px 12px;
    }

    .layer-core {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-left: 3.5px solid var(--navy);
    }

    .layer-secondary {
      background: var(--bg-paper);
      border: 1px solid var(--border);
    }

    .layer-trap {
      background: var(--trap-bg);
      border: 1px solid var(--trap-border);
      border-left: 3.5px solid var(--trap-accent);
    }

    .layer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .layer-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .layer-core .layer-title { color: var(--navy); }
    .layer-secondary .layer-title { color: var(--ink-secondary); }
    .layer-trap .layer-title { color: var(--trap-ink); }

    .btn-reveal-all {
      font-size: 11px;
      font-weight: 600;
      color: var(--navy);
      background: var(--navy-soft);
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--navy-border);
    }

    .layer-text {
      margin: 0;
      font-size: 13.5px;
      line-height: 1.62;
      color: var(--ink);
    }

    .layer-secondary .layer-text {
      font-size: 13px;
      color: var(--ink-secondary);
    }

    .layer-trap .layer-text {
      font-size: 13px;
      color: var(--trap-ink);
    }

    /* 关键词高亮 & 挖空胶囊 */
    .kw-hl {
      color: var(--meeting-dark);
      font-weight: 700;
      background: var(--meeting-soft);
      padding: 0 3px;
      border-radius: 4px;
    }

    .kw-hl.work {
      color: var(--work-dark);
      background: var(--work-soft);
    }

    .kw-cloze {
      display: inline-block;
      padding: 0 8px;
      margin: 0 2px;
      border-radius: 5px;
      font-weight: 700;
      cursor: pointer;
      vertical-align: baseline;
    }

    .kw-cloze.hidden {
      background: var(--navy);
      color: transparent;
      position: relative;
      user-select: none;
    }

    .kw-cloze.hidden::after {
      content: "点击揭晓";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-size: 10.5px;
      font-weight: 600;
    }

    .kw-cloze.revealed {
      background: var(--work-soft);
      color: var(--work-dark);
      border: 1px solid var(--work-border);
    }

    /* 时间链 + 同组口诀 */
    .chain-box {
      background: var(--navy-soft);
      border: 1px solid var(--navy-border);
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .chain-row {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
      color: var(--ink-secondary);
    }

    .chain-node {
      background: #FFFFFF;
      border: 1px solid var(--border);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11.5px;
      color: var(--navy);
      font-weight: 600;
      cursor: pointer;
    }

    .chain-node.current {
      background: var(--navy);
      color: #FFFFFF;
      border-color: var(--navy);
      cursor: default;
    }

    .mnemonic-line {
      font-size: 12px;
      color: var(--navy-dark);
      border-top: 1px dashed var(--navy-border);
      padding-top: 5px;
    }

    /* 随堂自测判断题 */
    .quiz-box {
      background: #FFFFFF;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .quiz-q {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 9px;
      line-height: 1.52;
    }

    .quiz-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-quiz {
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      border: 1.5px solid var(--border);
      background: var(--bg-paper);
      color: var(--ink);
    }

    .btn-quiz:hover:not(:disabled) {
      border-color: var(--navy);
      background: var(--navy-soft);
    }

    .btn-quiz.correct-picked {
      background: var(--work-soft);
      border-color: var(--work);
      color: var(--work-dark);
    }

    .btn-quiz.wrong-picked {
      background: var(--meeting-soft);
      border-color: var(--meeting);
      color: var(--meeting);
    }

    .quiz-feedback {
      margin-top: 8px;
      padding: 7px 10px;
      border-radius: 7px;
      font-size: 12.5px;
      line-height: 1.52;
    }

    .quiz-feedback.ok { background: var(--work-soft); color: var(--work-dark); }
    .quiz-feedback.err { background: var(--meeting-soft); color: var(--meeting-dark); }

    .back-footer {
      padding: 7px 14px;
      border-top: 1px solid var(--border);
      background: #FAF9F5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--ink-muted);
      flex-shrink: 0;
    }

    .btn-flip-back {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--navy);
      background: var(--navy-soft);
      padding: 4px 10px;
      border-radius: 7px;
    }

    /* ==========================================================================
       7. 模式三：陷阱狙击卡片 & 空状态卡片
       ========================================================================== */
    .sniper-card {
      width: 100%;
      height: clamp(415px, 57dvh, 535px);
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1.5px solid var(--trap-border);
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sniper-header {
      padding: 12px 16px;
      background: var(--trap-bg);
      border-bottom: 1px solid var(--trap-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sniper-body {
      flex: 1;
      padding: 18px 18px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .sniper-statement {
      font-family: var(--font-serif);
      font-size: 17.5px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.58;
      padding: 15px;
      background: var(--bg-paper);
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .state-card {
      width: 100%;
      min-height: 415px;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow-md);
      padding: 28px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .state-icon {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: var(--navy-soft);
      color: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 14px;
    }

    .state-card h2 {
      margin: 0 0 8px;
      font-family: var(--font-serif);
      font-size: 20px;
      color: var(--ink);
    }

    .state-card p {
      margin: 0 0 20px;
      font-size: 13.5px;
      color: var(--ink-secondary);
      max-width: 360px;
    }

    /* ==========================================================================
       8. 底部操作区与桌面快捷键
       ========================================================================== */
    .action-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .guard-banner {
      text-align: center;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--trap-ink);
      background: var(--trap-bg);
      border: 1px solid var(--trap-border);
      border-radius: 9px;
      padding: 5px 10px;
    }

    .action-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn-primary {
      flex: 1;
      min-height: 52px;
      padding: 11px 16px;
      border-radius: var(--radius-md);
      background: var(--navy);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 5px 14px rgba(34, 58, 89, 0.2);
    }

    .btn-primary:hover:not(:disabled) { background: var(--navy-dark); }
    .btn-primary:disabled { background: #D7D4CC; color: #8A867D; box-shadow: none; }

    .btn-unfamiliar {
      flex: 1;
      min-height: 54px;
      padding: 8px 10px;
      border-radius: var(--radius-md);
      background: var(--meeting-soft);
      border: 1.5px solid var(--meeting);
      color: var(--meeting);
      font-size: 14.5px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .btn-mastered {
      flex: 1;
      min-height: 54px;
      padding: 8px 10px;
      border-radius: var(--radius-md);
      background: var(--work);
      color: #FFFFFF;
      font-size: 14.5px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 14px rgba(29, 99, 83, 0.2);
    }

    .btn-unfamiliar span.sub, .btn-mastered span.sub {
      font-size: 10.5px;
      font-weight: 400;
      opacity: 0.88;
    }

    .btn-unfamiliar:disabled, .btn-mastered:disabled {
      background: #E8E5DC;
      border-color: #DAD6CC;
      color: #969288;
      box-shadow: none;
    }

    .sub-action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 26px;
    }

    .btn-undo {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-secondary);
      padding: 4px 8px;
      border-radius: 7px;
    }

    .btn-undo:hover:not(:disabled) { background: var(--bg-subtle); color: var(--ink); }
    .btn-undo:disabled { opacity: 0.35; }

    .kbd-hints {
      display: none;
      margin-top: 8px;
      text-align: center;
      font-size: 11px;
      color: var(--ink-muted);
    }

    .kbd {
      display: inline-block;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--ink-secondary);
    }

    @media (min-width: 768px) {
      .kbd-hints { display: block; }
    }

    /* ==========================================================================
       9. 抽屉（时间轴 · 双盒 · 分组对比 · 高频专题）与确认弹窗
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(30, 36, 43, 0.48);
      backdrop-filter: blur(2px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }

    @media (min-width: 640px) {
      .modal-backdrop { align-items: center; padding: 18px; }
    }

    .modal-backdrop.open { display: flex; }

    .modal-panel {
      width: 100%;
      max-width: 680px;
      max-height: 89dvh;
      background: var(--bg-paper);
      border-radius: 18px 18px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 -10px 32px rgba(0, 0, 0, 0.16);
    }

    @media (min-width: 640px) {
      .modal-panel { border-radius: 18px; max-height: 86dvh; }
    }

    .modal-panel.small {
      max-width: 390px;
      border-radius: 16px;
      margin: 16px;
      align-self: center;
    }

    .modal-header {
      padding: 13px 16px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 15.5px;
      font-family: var(--font-serif);
    }

    .btn-close {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--bg-subtle);
      color: var(--ink-secondary);
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-toolbar {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .drawer-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      background: var(--bg-subtle);
      padding: 3px;
      border-radius: 10px;
    }

    .drawer-tab {
      padding: 7px 4px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-secondary);
    }

    .drawer-tab.active {
      background: var(--bg-card);
      color: var(--navy);
      box-shadow: var(--shadow-sm);
    }

    .search-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 140px;
      padding: 7px 11px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      font-size: 13px;
      color: var(--ink);
      outline: none;
    }

    .select-filter {
      padding: 7px 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      font-size: 12px;
      color: var(--ink);
    }

    .modal-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px 24px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      -webkit-overflow-scrolling: touch;
    }

    .tl-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 10px 12px;
    }

    .tl-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .tl-main {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      cursor: pointer;
      flex: 1;
      min-width: 0;
    }

    .tl-year {
      font-family: var(--font-mono);
      font-size: 12.5px;
      font-weight: 800;
      color: var(--navy);
      min-width: 46px;
    }

    .tl-kind {
      font-size: 10.5px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
    }

    .tl-kind.meeting { background: var(--meeting-soft); color: var(--meeting); }
    .tl-kind.work { background: var(--work-soft); color: var(--work); }

    .tl-name {
      font-weight: 700;
      font-size: 13.5px;
      color: var(--ink);
    }

    .tl-tag {
      font-size: 11px;
      color: var(--ink-muted);
      background: var(--bg-paper);
      padding: 1px 6px;
      border-radius: 5px;
    }

    .tl-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .btn-move {
      padding: 4px 8px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .btn-move.to-mastered { background: var(--work-soft); color: var(--work); }
    .btn-move.to-unfamiliar { background: var(--meeting-soft); color: var(--meeting); }
    .btn-move.jump-btn { background: var(--navy-soft); color: var(--navy); }

    .tl-detail {
      display: none;
      margin-top: 9px;
      padding-top: 9px;
      border-top: 1px dashed var(--border);
      font-size: 12.5px;
      line-height: 1.56;
      color: var(--ink-secondary);
    }

    .tl-item.expanded .tl-detail { display: block; }

    /* 分组对比与高频专题卡片 */
    .comp-section-label {
      font-size: 12px;
      font-weight: 800;
      color: var(--ink-muted);
      letter-spacing: 0.5px;
      margin: 4px 0 2px;
    }

    .comp-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .comp-card.meeting-accent { border-left: 4px solid var(--meeting); }
    .comp-card.work-accent { border-left: 4px solid var(--work); }
    .comp-card.special-accent { border-left: 4px solid var(--trap-accent); }

    .comp-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--navy);
      margin: 0 0 6px;
    }

    .comp-card.meeting-accent .comp-title { color: var(--meeting-dark); }
    .comp-card.work-accent .comp-title { color: var(--work-dark); }
    .comp-card.special-accent .comp-title { color: var(--trap-ink); }

    .comp-mnemonic {
      background: var(--navy-soft);
      color: var(--navy-dark);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 7px;
      margin-bottom: 7px;
    }

    .comp-diff {
      font-size: 12.5px;
      color: var(--ink-secondary);
      margin-bottom: 8px;
    }

    .comp-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .comp-table th {
      text-align: left;
      font-size: 11px;
      color: var(--ink-muted);
      padding: 4px 6px;
      border-bottom: 1px solid var(--border);
    }

    .comp-table td {
      padding: 6px 6px;
      border-top: 1px solid var(--bg-subtle);
      vertical-align: top;
      line-height: 1.45;
    }

    .comp-table td.mono {
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--navy);
      white-space: nowrap;
      width: 56px;
    }

    .comp-table td.bold {
      font-weight: 700;
      color: var(--ink);
    }

    .confirm-body {
      padding: 18px;
      text-align: center;
    }

    .confirm-body p {
      margin: 0 0 16px;
      font-size: 13.5px;
      color: var(--ink-secondary);
    }

    .confirm-actions {
      display: flex;
      gap: 10px;
    }

    .btn-cancel {
      flex: 1;
      padding: 9px;
      border-radius: 9px;
      background: var(--bg-subtle);
      font-weight: 600;
      font-size: 13.5px;
    }

    .btn-confirm-danger {
      flex: 1;
      padding: 9px;
      border-radius: 9px;
      background: var(--meeting);
      color: #FFFFFF;
      font-weight: 600;
      font-size: 13.5px;
    }

    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-14px);
      background: rgba(30, 36, 43, 0.94);
      color: #FFFFFF;
      padding: 7px 15px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 200;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div class="app-container">
    <!-- 沉浸专注模式退出栏 -->
    <div class="zen-exit-bar">
      <span style="font-size:12px;font-weight:700;color:var(--navy);">🧘 沉浸专注中 · <span id="zenPomoMirror">25:00</span></span>
      <button id="btnExitZen" class="btn-mini" type="button">退出沉浸</button>
    </div>

    <!-- 顶部栏 -->
    <header class="header zen-hide">
      <div class="brand">
        <div class="brand-seal" aria-hidden="true">57</div>
        <div>
          <h1 class="brand-title">党史会议 × 毛选著作抽签器</h1>
          <p class="brand-sub">考研政治 · 32核心会议 + 25篇毛选</p>
        </div>
      </div>

      <div class="header-tools">
        <div id="pomoPill" class="pomo-pill">
          <span title="番茄专注钟">⏱</span>
          <span id="pomoDisplay" class="pomo-time">25:00</span>
          <button id="btnPomoToggle" class="pomo-btn" type="button">开始</button>
          <button id="btnPomoDuration" class="pomo-btn" type="button" title="切换 25/15/5 分钟">25m</button>
          <button id="btnPomoReset" class="pomo-btn" type="button" title="重置计时">↺</button>
        </div>
        <button id="btnZenToggle" class="pill-btn" type="button" title="沉浸专注模式">🧘 专注</button>
      </div>
    </header>

    <!-- 顶部板块筛选胶囊 -->
    <div class="scope-strip zen-hide" role="tablist" aria-label="背诵板块">
      <button class="scope-btn active" data-scope="all" type="button">
        <span class="dot" style="background:var(--navy);"></span>全部混抽 (57)
      </button>
      <button class="scope-btn" data-scope="meeting" type="button">
        <span class="dot" style="background:var(--meeting);"></span>核心会议 (32)
      </button>
      <button class="scope-btn" data-scope="work" type="button">
        <span class="dot" style="background:var(--work);"></span>毛选著作 (25)
      </button>
    </div>

    <!-- 三大独立模式导航 -->
    <nav class="mode-switcher zen-hide" aria-label="复习模式">
      <button id="tabRound" class="mode-tab active" type="button">
        <span>全量轮抽</span>
        <span class="sub">无放回不重序</span>
      </button>
      <button id="tabBox" class="mode-tab" type="button">
        <span>双盒智能记忆</span>
        <span class="sub">陌生加权·熟练归档</span>
      </button>
      <button id="tabSniper" class="mode-tab" type="button">
        <span>陷阱狙击</span>
        <span class="sub">易混判断专刷</span>
      </button>
    </nav>

    <!-- 记忆控制工具条 -->
    <div class="toolbar-strip zen-hide">
      <div class="toolbar-left">
        <button id="btnClozeToggle" class="pill-btn" type="button">🧩 挖空: <strong id="clozeLabel">关</strong></button>
        <button id="btnBlindToggle" class="pill-btn" type="button">🙈 盲测: <strong id="blindLabel">关</strong></button>
        <button id="btnLockToggle" class="pill-btn active-trap" type="button">🔒 防误触: <strong id="lockLabel">开</strong></button>
      </div>
      <div class="toolbar-right">
        <button id="btnOpenDrawer" class="pill-btn active-navy" type="button">🧭 时间轴 · 双盒 · 对比</button>
      </div>
    </div>

    <!-- 状态统计栏 -->
    <section class="status-bar zen-hide" aria-label="当前进度">
      <div id="statusMetrics" class="status-metrics"></div>
      <div>
        <button id="btnResetMode" class="btn-mini danger" type="button">↺ 重置本模式</button>
      </div>
    </section>

    <!-- 核心签卡舞台 -->
    <main id="stageWrapper" class="stage-wrapper"></main>

    <!-- 底部操作区 -->
    <section id="actionArea" class="action-area"></section>

    <!-- 桌面端快捷键提示 -->
    <div id="kbdHints" class="kbd-hints zen-hide"></div>
  </div>

  <!-- 时间轴 · 双盒 · 分组对比 · 高频专题抽屉 -->
  <div id="drawerModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <div class="modal-panel">
      <div class="modal-header">
        <h3 id="drawerTitle">时间轴 · 双盒 · 对比速查</h3>
        <button id="btnCloseDrawer" class="btn-close" type="button" aria-label="关闭">×</button>
      </div>
      <div class="modal-toolbar">
        <div class="drawer-tabs">
          <button id="dTabTimeline" class="drawer-tab active" type="button">📅 时间轴检索</button>
          <button id="dTabCompare" class="drawer-tab" type="button">⚖️ 分组差异对比</button>
          <button id="dTabSpecial" class="drawer-tab" type="button">🎯 高频专题速查</button>
        </div>
        <div id="timelineFilters" class="search-row">
          <input id="searchInput" class="search-input" type="text" placeholder="按年份、名称、关键词或陷阱检索..." />
          <select id="statusFilter" class="select-filter" aria-label="筛选条件">
            <option value="ALL">全部 (57)</option>
            <option value="MEETING">仅会议 (32)</option>
            <option value="WORK">仅著作 (25)</option>
            <option value="HIGH">🔥 高优错题</option>
            <option value="UNFAMILIAR">陌生/复习盒</option>
            <option value="MASTERED">熟练归档盒</option>
          </select>
        </div>
      </div>
      <div id="drawerContent" class="modal-list"></div>
    </div>
  </div>

  <!-- 二次确认弹窗 -->
  <div id="confirmModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal-panel small">
      <div class="modal-header">
        <h3 id="confirmTitle">确认操作</h3>
        <button id="btnCloseConfirm" class="btn-close" type="button" aria-label="关闭">×</button>
      </div>
      <div class="confirm-body">
        <p id="confirmMessage"></p>
        <div class="confirm-actions">
          <button id="btnCancelConfirm" class="btn-cancel" type="button">取消</button>
          <button id="btnDoConfirm" class="btn-confirm-danger" type="button">确认</button>
        </div>
