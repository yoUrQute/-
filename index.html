       3. 算法工具：Fisher-Yates 洗牌 & 严格不重序生成
       ========================================================================== */
    function fisherYates(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function sameOrder(a, b) {
      if (!Array.isArray(a) || !Array.isArray(b) || a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
      return true;
    }

    function generateDistinctOrder(pool, lastOrder) {
      let next = fisherYates(pool);
      let guard = 0;
      while (sameOrder(next, lastOrder) && guard < 24) {
        next = fisherYates(pool);
        guard++;
      }
      if (sameOrder(next, lastOrder) && next.length >= 2) {
        [next[0], next[1]] = [next[1], next[0]];
      }
      return next;
    }

    /* ==========================================================================
       4. 三板块 × 三模式独立状态管理与持久化
       ========================================================================== */
    function createRoundScopeState(scope, prevOrder = []) {
      const pool = getScopeIds(scope);
      const order = generateDistinctOrder(pool, prevOrder);
      return {
        roundNumber: 1,
        roundOrder: order,
        remainingIds: [...order],
        drawnIds: [],
        currentId: null,
        lastRoundOrder: prevOrder,
        roundCompleted: false,
        history: []
      };
    }

    function createBoxState() {
      return {
        masteredIds: [],             // 全局熟练归档集合（不再被抽取）
        manualUnfamiliarCounts: {},  // 手动标记陌生次数（权重×2.5）
        currentByScope: { all: null, meeting: null, work: null },
        lastDrawnByScope: { all: null, meeting: null, work: null },
        drawCount: 0,
        history: []
      };
    }

    function createSniperState() {
      return {
        queues: { all: [], meeting: [], work: [] },
        currentByScope: { all: null, meeting: null, work: null },
        answeredCount: 0,
        correctCount: 0
      };
    }

    let appState = {
      scope: "all",        // 'all' | 'meeting' | 'work'
      activeMode: "round", // 'round' | 'box' | 'sniper'
      antiMistouch: true,
      clozeMode: false,
      blindMode: false,
      zenMode: false,
      combo: 0,
      wrongCounts: {},     // { [id]: number } 随堂/狙击答错计数（全局高优，权重×4）
      rounds: {
        all: createRoundScopeState("all"),
        meeting: createRoundScopeState("meeting"),
        work: createRoundScopeState("work")
      },
      box: createBoxState(),
      sniper: createSniperState()
    };

    let uiState = {
      isFlipped: false,
      hasViewedBack: false,
      cooldownUntil: 0,
      shouldAnimateDraw: false,
      revealedClozeIndexes: new Set(),
      cardQuizAnswer: null,
      sniperPicked: null,
      drawerTab: "timeline", // 'timeline' | 'compare' | 'special'
      confirmCallback: null
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const p = JSON.parse(raw);
        if (!p || typeof p !== "object") return;

        if (["all", "meeting", "work"].includes(p.scope)) appState.scope = p.scope;
        if (["round", "box", "sniper"].includes(p.activeMode)) appState.activeMode = p.activeMode;
        if (typeof p.antiMistouch === "boolean") appState.antiMistouch = p.antiMistouch;
        if (typeof p.clozeMode === "boolean") appState.clozeMode = p.clozeMode;
        if (typeof p.blindMode === "boolean") appState.blindMode = p.blindMode;
        if (typeof p.combo === "number") appState.combo = p.combo;
        if (p.wrongCounts && typeof p.wrongCounts === "object") appState.wrongCounts = p.wrongCounts;

        if (p.rounds && typeof p.rounds === "object") {
          ["all", "meeting", "work"].forEach(sc => {
            if (p.rounds[sc] && Array.isArray(p.rounds[sc].remainingIds)) {
              appState.rounds[sc] = { ...createRoundScopeState(sc), ...p.rounds[sc] };
            }
          });
        }
        if (p.box && Array.isArray(p.box.masteredIds)) {
          appState.box = { ...createBoxState(), ...p.box };
        }
        if (p.sniper && p.sniper.queues) {
          appState.sniper = { ...createSniperState(), ...p.sniper };
        }
      } catch (e) {
        console.warn("读取本地状态失败：", e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.warn("保存本地状态失败：", e);
      }
    }

    /* ==========================================================================
       5. 轻提示、防连点节流、番茄专注钟
       ========================================================================== */
    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2000);
    }

    function isCoolingDown() { return Date.now() < uiState.cooldownUntil; }
    function triggerCooldown(ms = 350) { uiState.cooldownUntil = Date.now() + ms; }

    function resetCardUI(animate = true) {
      uiState.isFlipped = false;
      uiState.hasViewedBack = false;
      uiState.shouldAnimateDraw = animate;
      uiState.revealedClozeIndexes = new Set();
      uiState.cardQuizAnswer = null;
    }

    // 番茄钟（25 / 15 / 5 分钟）
    const POMO_PRESETS = [25, 15, 5];
    let pomo = { presetIdx: 0, remainingSec: 25 * 60, running: false, timerId: null };

    function formatClock(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return `${m}:${s}`;
    }

    function updatePomoUI() {
      const txt = formatClock(pomo.remainingSec);
      document.getElementById("pomoDisplay").textContent = txt;
      document.getElementById("zenPomoMirror").textContent = txt;
      document.getElementById("btnPomoToggle").textContent = pomo.running ? "暂停" : "开始";
      document.getElementById("btnPomoDuration").textContent = `${POMO_PRESETS[pomo.presetIdx]}m`;
      document.getElementById("pomoPill").classList.toggle("running", pomo.running);
    }

    function togglePomo() {
      if (pomo.running) {
        clearInterval(pomo.timerId);
        pomo.running = false;
      } else {
        if (pomo.remainingSec <= 0) pomo.remainingSec = POMO_PRESETS[pomo.presetIdx] * 60;
        pomo.running = true;
        pomo.timerId = setInterval(() => {
          pomo.remainingSec--;
          updatePomoUI();
          if (pomo.remainingSec <= 0) {
            clearInterval(pomo.timerId);
            pomo.running = false;
            updatePomoUI();
            showToast("⏱ 番茄专注完成，适当休息 5 分钟！");
          }
        }, 1000);
      }
      updatePomoUI();
    }

    function cyclePomoDuration() {
      clearInterval(pomo.timerId);
      pomo.running = false;
      pomo.presetIdx = (pomo.presetIdx + 1) % POMO_PRESETS.length;
      pomo.remainingSec = POMO_PRESETS[pomo.presetIdx] * 60;
      updatePomoUI();
    }

    function resetPomo() {
      clearInterval(pomo.timerId);
      pomo.running = false;
      pomo.remainingSec = POMO_PRESETS[pomo.presetIdx] * 60;
      updatePomoUI();
    }

    /* ==========================================================================
       6. 模式一：全量轮抽（按板块独立保存轮次，严格不重序）
       ========================================================================== */
    function getCurRound() { return appState.rounds[appState.scope]; }

    function drawNextRound() {
      if (isCoolingDown()) return;
      const r = getCurRound();
      r.history.push({
        remainingIds: [...r.remainingIds],
        drawnIds: [...r.drawnIds],
        currentId: r.currentId,
        roundCompleted: r.roundCompleted
      });
      if (r.history.length > 25) r.history.shift();

      if (r.remainingIds.length === 0) {
        r.currentId = null;
        r.roundCompleted = true;
        saveState();
        triggerCooldown();
        renderAll();
        return;
      }

      const nextId = r.remainingIds.shift();
      r.drawnIds.push(nextId);
      r.currentId = nextId;
      r.roundCompleted = false;
      resetCardUI(true);
      saveState();
      triggerCooldown();
      renderAll();
    }

    function startNewRound() {
      if (isCoolingDown()) return;
      const sc = appState.scope;
      const r = appState.rounds[sc];
      const pool = getScopeIds(sc);
      const prev = r.roundOrder.length === pool.length ? r.roundOrder : r.drawnIds;
      const nextOrder = generateDistinctOrder(pool, prev);

      r.roundNumber += 1;
      r.lastRoundOrder = [...prev];
      r.roundOrder = nextOrder;
      r.remainingIds = [...nextOrder];
      r.drawnIds = [];
      r.history = [];
      r.roundCompleted = false;

      const firstId = r.remainingIds.shift();
      r.drawnIds.push(firstId);
      r.currentId = firstId;
      resetCardUI(true);
      saveState();
      triggerCooldown();
      showToast(`第 ${r.roundNumber} 轮已开启（全新不重复顺序）`);
      renderAll();
    }

    function undoRound() {
      if (isCoolingDown()) return;
      const r = getCurRound();
      if (!r.history.length) return;
      const snap = r.history.pop();
      Object.assign(r, snap);
      resetCardUI(true);
      uiState.hasViewedBack = true;
      saveState();
      triggerCooldown(220);
      showToast("已撤回上一签");
      renderAll();
    }

    /* ==========================================================================
       7. 模式二：双盒智能记忆（错题×4、手动陌生×2.5、常规×1，防连抽）
       ========================================================================== */
    function getScopeUnfamiliarIds(scope = appState.scope) {
      const masteredSet = new Set(appState.box.masteredIds);
      return getScopeIds(scope).filter(id => !masteredSet.has(id));
    }

    function getScopeMasteredIds(scope = appState.scope) {
      const masteredSet = new Set(appState.box.masteredIds);
      return getScopeIds(scope).filter(id => masteredSet.has(id));
    }

    function getItemWeight(id) {
      const wrong = appState.wrongCounts[id] || 0;
      const manual = appState.box.manualUnfamiliarCounts[id] || 0;
      if (wrong > 0) return 4 * (1 + Math.min(wrong - 1, 3) * 0.25);
      if (manual > 0) return 2.5 * (1 + Math.min(manual - 1, 3) * 0.2);
      return 1;
    }

    function pickWeightedBoxId(scope = appState.scope, excludeId = null) {
      const pool = getScopeUnfamiliarIds(scope);
      if (!pool.length) return null;
      if (pool.length === 1) return pool[0];

      const candidates = excludeId !== null ? pool.filter(id => id !== excludeId) : pool;
      const list = candidates.length ? candidates : pool;

      let total = 0;
      const weights = list.map(id => {
        const w = getItemWeight(id);
        total += w;
        return w;
      });
      let rand = Math.random() * total;
      for (let i = 0; i < list.length; i++) {
        rand -= weights[i];
        if (rand <= 0) return list[i];
      }
      return list[list.length - 1];
    }

    function pushBoxHistory() {
      const b = appState.box;
      b.history.push({
        masteredIds: [...b.masteredIds],
        manualUnfamiliarCounts: { ...b.manualUnfamiliarCounts },
        currentByScope: { ...b.currentByScope },
        lastDrawnByScope: { ...b.lastDrawnByScope },
        drawCount: b.drawCount
      });
      if (b.history.length > 25) b.history.shift();
    }

    function drawFirstBox() {
      if (isCoolingDown()) return;
      const sc = appState.scope;
      const b = appState.box;
      const id = pickWeightedBoxId(sc, b.lastDrawnByScope[sc]);
      if (!id) return;
      b.currentByScope[sc] = id;
      b.lastDrawnByScope[sc] = id;
      b.drawCount += 1;
      resetCardUI(true);
      saveState();
      triggerCooldown();
      renderAll();
    }

    function markBoxUnfamiliar() {
      if (isCoolingDown()) return;
      const sc = appState.scope;
      const b = appState.box;
      const prev = b.currentByScope[sc];
      if (!prev) return;
      pushBoxHistory();
      b.manualUnfamiliarCounts[prev] = (b.manualUnfamiliarCounts[prev] || 0) + 1;

      const next = pickWeightedBoxId(sc, prev);
      b.currentByScope[sc] = next;
      b.lastDrawnByScope[sc] = next;
      b.drawCount += 1;
      resetCardUI(true);
      saveState();
      triggerCooldown();
      showToast("已留存陌生盒（权重×2.5 优先重抽）");
      renderAll();
    }

    function markBoxMastered() {
      if (isCoolingDown()) return;
      const sc = appState.scope;
      const b = appState.box;
      const id = b.currentByScope[sc];
      if (!id) return;
      pushBoxHistory();

      if (!b.masteredIds.includes(id)) b.masteredIds.push(id);
      // 同步清理其它板块如果恰好停在该张已熟练卡片上的指针
      ["all", "meeting", "work"].forEach(k => {
        if (k !== sc && b.currentByScope[k] === id) b.currentByScope[k] = null;
      });

      const next = pickWeightedBoxId(sc, id);
      if (!next) {
        b.currentByScope[sc] = null;
        resetCardUI(false);
        showToast("当前板块已全部归档至熟练盒！");
      } else {
        b.currentByScope[sc] = next;
        b.lastDrawnByScope[sc] = next;
        b.drawCount += 1;
        resetCardUI(true);
        showToast(`「${CARD_MAP[id].title}」已归档熟练盒`);
      }
      saveState();
      triggerCooldown();
      renderAll();
    }

    function undoBox() {
      if (isCoolingDown()) return;
      const b = appState.box;
      if (!b.history.length) return;
      const snap = b.history.pop();
      Object.assign(b, snap);
      resetCardUI(true);
      uiState.hasViewedBack = true;
      saveState();
      triggerCooldown(220);
      showToast("已撤回上一步");
      renderAll();
    }

    function moveBoxItem(id, target) {
      const b = appState.box;
      pushBoxHistory();
      if (target === "mastered") {
        if (!b.masteredIds.includes(id)) b.masteredIds.push(id);
        ["all", "meeting", "work"].forEach(sc => {
          if (b.currentByScope[sc] === id) {
            b.currentByScope[sc] = pickWeightedBoxId(sc, id);
          }
        });
        showToast(`已归档熟练盒：${CARD_MAP[id].title}`);
      } else {
        b.masteredIds = b.masteredIds.filter(x => x !== id);
        showToast(`已移回陌生盒：${CARD_MAP[id].title}`);
      }
      saveState();
      renderAll();
      renderDrawerContent();
    }

    /* ==========================================================================
       8. 模式三：陷阱狙击（当前板块判断专刷，错题高优）
       ========================================================================== */
    function pickNextSniperId(scope = appState.scope, excludeId = null) {
      const s = appState.sniper;
      if (!s.queues[scope] || !s.queues[scope].length) {
        const pool = getScopeIds(scope);
        const wrongs = pool.filter(id => (appState.wrongCounts[id] || 0) > 0);
        const normals = pool.filter(id => !(appState.wrongCounts[id] || 0));
        s.queues[scope] = [...fisherYates(wrongs), ...fisherYates(normals)];
      }
      const q = s.queues[scope];
      if (q.length > 1 && q[0] === excludeId) {
        q.push(q.shift());
      }
      return q.shift();
    }

    function nextSniperQuestion() {
      if (isCoolingDown()) return;
      const sc = appState.scope;
      const s = appState.sniper;
      s.currentByScope[sc] = pickNextSniperId(sc, s.currentByScope[sc]);
      uiState.sniperPicked = null;
      uiState.shouldAnimateDraw = true;
      saveState();
      triggerCooldown(240);
      renderAll();
    }

    function submitQuizResult(cardId, userAns, isSniper = false) {
      const c = CARD_MAP[cardId];
      const isCorrect = userAns === c.quiz.ans;

      if (isCorrect) {
        appState.combo += 1;
        if (isSniper) appState.sniper.correctCount += 1;
      } else {
        appState.combo = 0;
        appState.wrongCounts[cardId] = (appState.wrongCounts[cardId] || 0) + 1;
        // 答错自动退回双盒陌生盒高优队列
        if (appState.box.masteredIds.includes(cardId)) {
          appState.box.masteredIds = appState.box.masteredIds.filter(x => x !== cardId);
        }
        showToast("🔥 答错已标为高优复习（双盒权重×4）");
      }

      if (isSniper) {
        appState.sniper.answeredCount += 1;
        uiState.sniperPicked = userAns;
      } else {
        uiState.cardQuizAnswer = userAns;
      }

      saveState();
      renderStatusBar();
      renderStage();
      renderActionArea();
    }

    /* ==========================================================================
       9. 抽屉内直接跳转抽看指定卡片
       ========================================================================== */
    function jumpToCard(id) {
      const c = CARD_MAP[id];
      if (!c) return;
      // 若当前板块不包含该卡片，自动切到全部混抽
      if ((appState.scope === "meeting" && c.type !== "meeting") ||
          (appState.scope === "work" && c.type !== "work")) {
        appState.scope = "all";
      }
      if (appState.activeMode === "sniper") {
        appState.sniper.currentByScope[appState.scope] = id;
        uiState.sniperPicked = null;
      } else if (appState.activeMode === "box") {
        appState.box.currentByScope[appState.scope] = id;
        resetCardUI(true);
      } else {
        const r = getCurRound();
        r.currentId = id;
        r.roundCompleted = false;
        resetCardUI(true);
      }
      closeDrawer();
      saveState();
      showToast(`已定位：${c.year} ${c.title}`);
      renderAll();
    }

    /* ==========================================================================
       10. 翻面与 {{关键词}} 挖空渲染
       ========================================================================== */
    function getCurrentCardId() {
      if (appState.activeMode === "round") return getCurRound().currentId;
      if (appState.activeMode === "box") return appState.box.currentByScope[appState.scope];
      return appState.sniper.currentByScope[appState.scope];
    }

    function flipCard() {
      if (appState.activeMode === "sniper") return;
      if (!getCurrentCardId()) return;

      uiState.isFlipped = !uiState.isFlipped;
      if (uiState.isFlipped) uiState.hasViewedBack = true;

      const card = document.getElementById("activeLotCard");
      if (card) card.classList.toggle("is-flipped", uiState.isFlipped);
      renderActionArea();
    }

    function formatCoreText(text, cardType, counter) {
      return text.replace(/\{\{([^}]+)\}\}/g, (_, kw) => {
        const idx = counter.count++;
        if (!appState.clozeMode) {
          return `<span class="kw-hl ${cardType}">${kw}</span>`;
        }
        const rev = uiState.revealedClozeIndexes.has(idx);
        return `<span class="kw-cloze no-flip ${rev ? "revealed" : "hidden"}" data-cloze-idx="${idx}">${kw}</span>`;
      });
    }

    /* ==========================================================================
       11. 主界面渲染
       ========================================================================== */
    function getScopeLabel(sc = appState.scope) {
      if (sc === "meeting") return "核心会议";
      if (sc === "work") return "毛选著作";
      return "全部混抽";
    }

    function renderTopControls() {
      document.body.classList.toggle("zen-mode", appState.zenMode);

      document.querySelectorAll(".scope-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.scope === appState.scope);
      });

      document.getElementById("tabRound").classList.toggle("active", appState.activeMode === "round");
      document.getElementById("tabBox").classList.toggle("active", appState.activeMode === "box");
      document.getElementById("tabSniper").classList.toggle("active", appState.activeMode === "sniper");

      document.getElementById("btnClozeToggle").classList.toggle("active-navy", appState.clozeMode);
      document.getElementById("clozeLabel").textContent = appState.clozeMode ? "开" : "关";

      document.getElementById("btnBlindToggle").classList.toggle("active-meeting", appState.blindMode);
      document.getElementById("blindLabel").textContent = appState.blindMode ? "开" : "关";

      document.getElementById("btnLockToggle").classList.toggle("active-trap", appState.antiMistouch);
      document.getElementById("lockLabel").textContent = appState.antiMistouch ? "开" : "关";
    }

    function renderStatusBar() {
      const el = document.getElementById("statusMetrics");
      const sc = appState.scope;
      const scopeIds = getScopeIds(sc);
      const total = scopeIds.length;
      const highCnt = scopeIds.filter(id => (appState.wrongCounts[id] || 0) > 0).length;
      const comboHtml = appState.combo >= 2
        ? `<div class="metric work"><span class="lbl">连对</span><strong>🔥 ${appState.combo}</strong></div>` : "";

      if (appState.activeMode === "round") {
        const r = getCurRound();
        el.innerHTML = `
          <div class="metric navy"><span class="lbl">${getScopeLabel()}</span><strong>第 ${r.roundNumber} 轮</strong></div>
          <div class="metric meeting"><span class="lbl">剩余</span><strong>${r.remainingIds.length} / ${total}</strong></div>
          ${comboHtml}
        `;
      } else if (appState.activeMode === "box") {
        const unfam = getScopeUnfamiliarIds(sc).length;
        const mast = getScopeMasteredIds(sc).length;
        el.innerHTML = `
          <div class="metric meeting"><span class="lbl">陌生盒</span><strong>${unfam}</strong></div>
          <div class="metric work"><span class="lbl">熟练盒</span><strong>${mast} / ${total}</strong></div>
          <div class="metric trap"><span class="lbl">错题高优</span><strong>${highCnt}</strong></div>
          ${comboHtml}
        `;
      } else {
        const s = appState.sniper;
        const acc = s.answeredCount ? Math.round((s.correctCount / s.answeredCount) * 100) : 0;
        el.innerHTML = `
          <div class="metric trap"><span class="lbl">已狙击</span><strong>${s.answeredCount} 题</strong></div>
          <div class="metric work"><span class="lbl">正确率</span><strong>${acc}%</strong></div>
          <div class="metric meeting"><span class="lbl">错题高优</span><strong>${highCnt}</strong></div>
          ${comboHtml}
        `;
      }
    }

    function renderStage() {
      const stage = document.getElementById("stageWrapper");
      const mode = appState.activeMode;
      const sc = appState.scope;
      const scopeTotal = getScopeIds(sc).length;

      // ---------- 模式三：陷阱狙击 ----------
      if (mode === "sniper") {
        const curId = appState.sniper.currentByScope[sc];
        if (!curId) {
          stage.innerHTML = `
            <div class="state-card">
              <div class="state-icon" style="background:var(--trap-bg);color:var(--trap-accent);">🎯</div>
              <h2>陷阱狙击 · ${getScopeLabel()} (${scopeTotal})</h2>
              <p>专攻当前板块的随堂判断题与易混干扰项。答错自动标记🔥高优复习并同步计入双盒 ×4 权重。</p>
              <button id="btnStartSniper" class="btn-primary" style="background:var(--meeting);max-width:250px;width:100%;" type="button">开始陷阱狙击</button>
            </div>
          `;
          document.getElementById("btnStartSniper").addEventListener("click", nextSniperQuestion);
          return;
        }

        const c = CARD_MAP[curId];
        const picked = uiState.sniperPicked;
        const answered = picked !== null;
        const isCorrect = answered && picked === c.quiz.ans;
        const wrongCnt = appState.wrongCounts[c.id] || 0;
        const anim = uiState.shouldAnimateDraw ? "drawing-anim" : "";
        uiState.shouldAnimateDraw = false;

        stage.innerHTML = `
          <div class="sniper-card ${anim}">
            <div class="sniper-header">
              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                <span class="type-badge ${c.type}">${c.type === "meeting" ? "会议" : "著作"}</span>
                <span style="font-size:13px;font-weight:800;color:var(--trap-ink);">${c.year} ${c.title}</span>
              </div>
              ${wrongCnt > 0 ? `<span class="priority-badge">🔥 错×${wrongCnt}</span>` : ""}
            </div>
            <div class="sniper-body">
              <div class="sniper-statement">${c.quiz.q}</div>
              <div class="quiz-btns">
                <button id="btnSniperT" class="btn-quiz ${answered && picked === true ? (isCorrect ? "correct-picked" : "wrong-picked") : ""}" type="button" ${answered ? "disabled" : ""}>✓ 正确</button>
                <button id="btnSniperF" class="btn-quiz ${answered && picked === false ? (isCorrect ? "correct-picked" : "wrong-picked") : ""}" type="button" ${answered ? "disabled" : ""}>✗ 错误</button>
              </div>
              ${answered ? `
                <div class="quiz-feedback ${isCorrect ? "ok" : "err"}">
                  <strong>${isCorrect ? "✓ 判断正确！" : "✗ 踩坑了！已标为🔥高优复习"}</strong><br/>${c.quiz.exp}
                </div>
                <div class="layer-box layer-trap">
                  <div class="layer-head"><span class="layer-title">③【陷阱干扰项】反向记忆</span></div>
                  <p class="layer-text">${c.trap}</p>
                </div>
              ` : `<div style="font-size:12px;color:var(--ink-muted);text-align:center;">作答后立即揭晓解析与本条陷阱干扰项</div>`}
            </div>
          </div>
        `;

        if (!answered) {
          document.getElementById("btnSniperT").addEventListener("click", () => submitQuizResult(c.id, true, true));
          document.getElementById("btnSniperF").addEventListener("click", () => submitQuizResult(c.id, false, true));
        }
        return;
      }

      // ---------- 模式一 / 模式二 空状态与完成态 ----------
      if (mode === "round") {
        const r = getCurRound();
        if (r.roundCompleted) {
          stage.innerHTML = `
            <div class="state-card">
              <div class="state-icon" style="background:var(--work-soft);color:var(--work);">✓</div>
              <h2>${getScopeLabel()} · 第 ${r.roundNumber} 轮全部抽完</h2>
              <p>共 ${scopeTotal} 张权威签已全部过完。开启新一轮将比对上一轮序列，保证顺序绝不重复。</p>
              <button id="btnNextRoundStart" class="btn-primary" style="max-width:250px;width:100%;" type="button">开启第 ${r.roundNumber + 1} 轮</button>
            </div>
          `;
          document.getElementById("btnNextRoundStart").addEventListener("click", startNewRound);
          return;
        }
        if (!r.currentId) {
          stage.innerHTML = `
            <div class="state-card">
              <div class="state-icon">🎋</div>
              <h2>全量轮抽 · ${getScopeLabel()} (${scopeTotal}签)</h2>
              <p>无放回随机抽取。先看正面年份与名称主动回忆，点击翻面核对三层考点与随堂判断。</p>
              <button id="btnStartRound" class="btn-primary" style="max-width:240px;width:100%;" type="button">抽取第一签</button>
            </div>
          `;
          document.getElementById("btnStartRound").addEventListener("click", drawNextRound);
          return;
        }
      } else {
        const unfamCount = getScopeUnfamiliarIds(sc).length;
        if (unfamCount === 0) {
          stage.innerHTML = `
            <div class="state-card">
              <div class="state-icon" style="background:var(--work-soft);color:var(--work);">🏆</div>
              <h2>${getScopeLabel()} 全部熟练！</h2>
              <p>当前板块 ${scopeTotal} 张卡片已全部归档至熟练盒。可前往抽屉复查错题，或切换其他板块继续背诵。</p>
              <button id="btnDoneDrawer" class="btn-primary" style="background:var(--work);max-width:240px;width:100%;" type="button">打开时间轴抽屉</button>
            </div>
          `;
          document.getElementById("btnDoneDrawer").addEventListener("click", () => openDrawer("timeline"));
          return;
        }
        if (!appState.box.currentByScope[sc]) {
          stage.innerHTML = `
            <div class="state-card">
              <div class="state-icon">⚡</div>
              <h2>双盒智能记忆 · ${getScopeLabel()}</h2>
              <p>陌生盒剩 ${unfamCount} 签。错题权重×4、手动陌生×2.5、常规×1，熟练后归档不再抽取，且防连续重抽。</p>
              <button id="btnStartBox" class="btn-primary" style="max-width:240px;width:100%;" type="button">从陌生盒抽签</button>
            </div>
          `;
          document.getElementById("btnStartBox").addEventListener("click", drawFirstBox);
          return;
        }
      }

      // ---------- 渲染 3D 零穿透正反面卡片 ----------
      const curId = getCurrentCardId();
      const c = CARD_MAP[curId];
      const wrongCnt = appState.wrongCounts[curId] || 0;
      const manualCnt = appState.box.manualUnfamiliarCounts[curId] || 0;
      const isMastered = appState.box.masteredIds.includes(curId);

      const counterText = mode === "round"
        ? `第 ${getCurRound().drawnIds.length} / ${scopeTotal} 签`
        : `陌生盒余 ${getScopeUnfamiliarIds(sc).length} 签`;

      const priorityHtml = wrongCnt > 0
        ? `<span class="priority-badge">🔥 错题高优 ×${wrongCnt}</span>`
        : (mode === "box" && manualCnt > 0)
          ? `<span class="priority-badge" style="background:var(--trap-bg);color:var(--trap-ink);border-color:var(--trap-border);">陌生 ×${manualCnt}</span>`
          : "";

      const clozeCounter = { count: 0 };
      const coreHtml = formatCoreText(c.core, c.type, clozeCounter);
      const hasCloze = appState.clozeMode && clozeCounter.count > 0;

      const qAns = uiState.cardQuizAnswer;
      const qDone = qAns !== null;
      const qOk = qDone && qAns === c.quiz.ans;

      const anim = uiState.shouldAnimateDraw ? "drawing-anim" : "";
      uiState.shouldAnimateDraw = false;

      const frontTypeBadge = appState.blindMode
        ? `<span class="type-badge blind">盲测模式</span>`
        : `<span class="type-badge ${c.type}">${c.type === "meeting" ? "核心会议" : "毛选著作"}</span>`;

      stage.innerHTML = `
        <div id="lotScene" class="lot-scene ${anim}">
          <div id="activeLotCard" class="lot-card ${uiState.isFlipped ? "is-flipped" : ""}">
            <!-- 正面（极简干净：年份 + 名称 + 极淡类型微标） -->
            <div class="card-face card-front">
              <div class="card-top-meta">
                <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                  ${frontTypeBadge}
                  ${priorityHtml}
                </div>
                <span class="lot-counter">${counterText}</span>
              </div>

              <div class="front-center">
                <div class="year-anchor ${appState.blindMode ? "blind" : c.type}">${c.year}</div>
                <h2 class="meeting-name-front">${c.title}</h2>
                <div class="front-divider"></div>
                <div class="front-group-hint">
                  ${appState.blindMode ? "纯年份+名称盲测回忆" : c.groupName}
                </div>
              </div>

              <div class="flip-hint">点击签面翻看核心标签、三层考点与随堂判断</div>
            </div>

            <!-- 背面（四重同步零穿透，独立顺滑滚动） -->
            <div class="card-face card-back">
              <div class="back-header">
                <div class="back-title-wrap">
                  <span class="back-year ${c.type}">${c.year}</span>
                  <h3 class="back-name">${c.title}</h3>
                </div>
                <span class="type-badge ${c.type}" style="flex-shrink:0;">${c.type === "meeting" ? "会议" : "著作"}</span>
              </div>

              <div class="back-body">
                <!-- ① 唯一核心标签锚点 -->
                <div class="anchor-tag-bar ${c.type}">
                  <span>🏷 核心标签：${c.coreTag}</span>
                  ${isMastered ? `<span style="font-size:11px;opacity:0.85;">✓ 已在熟练盒</span>` : ""}
                </div>

                <!-- ② 必背核心 -->
                <div class="layer-box layer-core">
                  <div class="layer-head">
                    <span class="layer-title">①【必背核心】高频单选 / 多选原话</span>
                    ${hasCloze ? `<button id="btnRevealCloze" class="btn-reveal-all no-flip" type="button">全部揭晓</button>` : ""}
                  </div>
                  <p class="layer-text">${coreHtml}</p>
                </div>

                <!-- ③ 次要要点 -->
                <div class="layer-box layer-secondary">
                  <div class="layer-head"><span class="layer-title">②【次要要点】配套补充</span></div>
                  <p class="layer-text">${c.secondary}</p>
                </div>

                <!-- ④ 陷阱干扰项（柔和琥珀底色） -->
                <div class="layer-box layer-trap">
                  <div class="layer-head"><span class="layer-title">③【陷阱干扰项】反向避坑</span></div>
                  <p class="layer-text">${c.trap}</p>
                </div>

                <!-- ⑤ 时间链前后串联 + 同组口诀 -->
                <div class="chain-box">
                  <div class="chain-row">
                    <span style="font-weight:700;color:var(--navy);">时间链：</span>
                    <span class="chain-node no-flip" data-chain="${c.chainPrev}">${c.chainPrev}</span>
                    <span>→</span>
                    <span class="chain-node current">${c.year} ${c.title}</span>
                    <span>→</span>
                    <span class="chain-node no-flip" data-chain="${c.chainNext}">${c.chainNext}</span>
                  </div>
                  <div class="mnemonic-line"><strong>同组口诀：</strong>${c.mnemonic}</div>
                </div>

                <!-- ⑥ 随堂判断题 -->
                <div class="quiz-box no-flip">
                  <div class="layer-head" style="margin-bottom:5px;">
                    <span class="layer-title" style="color:var(--ink);">✦ 随堂自测判断</span>
                    <span style="font-size:11px;color:var(--ink-muted);">答错自动标🔥高优</span>
                  </div>
                  <div class="quiz-q">${c.quiz.q}</div>
                  <div class="quiz-btns">
                    <button id="btnCardQuizT" class="btn-quiz ${qDone && qAns === true ? (qOk ? "correct-picked" : "wrong-picked") : ""}" type="button" ${qDone ? "disabled" : ""}>✓ 正确</button>
                    <button id="btnCardQuizF" class="btn-quiz ${qDone && qAns === false ? (qOk ? "correct-picked" : "wrong-picked") : ""}" type="button" ${qDone ? "disabled" : ""}>✗ 错误</button>
                  </div>
                  ${qDone ? `<div class="quiz-feedback ${qOk ? "ok" : "err"}">${c.quiz.exp}</div>` : ""}
                </div>
              </div>

              <div class="back-footer">
                <span>${hasCloze ? "点击蓝块揭晓挖空关键词" : "上下滑动查看完整解析"}</span>
                <button id="btnFlipBack" class="btn-flip-back" type="button">↻ 翻回正面</button>
              </div>
            </div>
          </div>
        </div>
      `;

      // 绑定点击与滑动防误触
      const scene = document.getElementById("lotScene");
      let sx = 0, sy = 0;
      scene.addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; });
      scene.addEventListener("click", e => {
        if (Math.hypot(e.clientX - sx, e.clientY - sy) > 8) return;

        // 挖空胶囊点击揭晓/重新遮盖
        const cloze = e.target.closest(".kw-cloze");
        if (cloze) {
          e.stopPropagation();
          const idx = Number(cloze.dataset.clozeIdx);
          if (uiState.revealedClozeIndexes.has(idx)) {
            uiState.revealedClozeIndexes.delete(idx);
            cloze.classList.replace("revealed", "hidden");
          } else {
            uiState.revealedClozeIndexes.add(idx);
            cloze.classList.replace("hidden", "revealed");
          }
          return;
        }

        // 一键全部揭晓
        if (e.target.closest("#btnRevealCloze")) {
          e.stopPropagation();
          scene.querySelectorAll(".kw-cloze").forEach(el => {
            uiState.revealedClozeIndexes.add(Number(el.dataset.clozeIdx));
            el.classList.replace("hidden", "revealed");
          });
          return;
        }

        // 时间链节点点击直接检索或跳转
        const chainNode = e.target.closest(".chain-node[data-chain]");
        if (chainNode) {
          e.stopPropagation();
          const txt = chainNode.dataset.chain;
          const match = SORTED_CARDS.find(item => txt.includes(item.title));
          if (match) {
            openDrawer("timeline", match.title);
          } else {
            showToast(`关联历史事件：${txt}`);
          }
          return;
        }

        if (e.target.closest(".no-flip")) return;
        // 背面时仅通过「翻回正面」按钮翻回，防止滑动/点选解析时误翻
        if (uiState.isFlipped && !e.target.closest("#btnFlipBack")) return;

        flipCard();
      });

      if (!qDone) {
        document.getElementById("btnCardQuizT").addEventListener("click", () => submitQuizResult(c.id, true, false));
        document.getElementById("btnCardQuizF").addEventListener("click", () => submitQuizResult(c.id, false, false));
      }
    }

    function renderActionArea() {
      const area = document.getElementById("actionArea");
      const kbd = document.getElementById("kbdHints");
      const mode = appState.activeMode;
      const sc = appState.scope;

      if (mode === "sniper") {
        if (!appState.sniper.currentByScope[sc]) {
          area.innerHTML = "";
          kbd.innerHTML = `快捷键：<span class="kbd">Space</span> 开始狙击`;
          return;
        }
        const answered = uiState.sniperPicked !== null;
        area.innerHTML = `
          <div class="action-row">
            <button id="btnSniperNext" class="btn-primary" style="background:var(--meeting);" type="button" ${answered ? "" : "disabled"}>
              ${answered ? "下一道陷阱题 →" : "请先完成上方判断"}
            </button>
          </div>
        `;
        document.getElementById("btnSniperNext").addEventListener("click", nextSniperQuestion);
        kbd.innerHTML = `快捷键：<span class="kbd">←</span> 正确 &nbsp;·&nbsp; <span class="kbd">→</span> 错误 &nbsp;·&nbsp; <span class="kbd">Space</span> 下一题`;
        return;
      }

      const curId = getCurrentCardId();
      if (!curId) {
        area.innerHTML = "";
        kbd.innerHTML = `快捷键：<span class="kbd">Space</span> 开始抽签 &nbsp;·&nbsp; <span class="kbd">C</span> 挖空切换`;
        return;
      }

      const locked = appState.antiMistouch && !uiState.hasViewedBack;
      const guard = locked ? `<div class="guard-banner">🔒 防误触保护：请先点击签面翻看背面考点，再操作</div>` : "";

      if (mode === "round") {
        const r = getCurRound();
        const txt = r.remainingIds.length === 0 ? "完成本轮抽签 ✓" : `抽下一签（余 ${r.remainingIds.length}）`;
        area.innerHTML = `
          ${guard}
          <div class="action-row">
            <button id="btnRoundNext" class="btn-primary" type="button" ${locked ? "disabled" : ""}>${txt}</button>
          </div>
          <div class="sub-action-row">
            <button id="btnUndoR" class="btn-undo" type="button" ${r.history.length ? "" : "disabled"}>↩ 撤回上一签</button>
            <span style="font-size:11px;color:var(--ink-muted);">${getScopeLabel()} · 第 ${r.roundNumber} 轮</span>
          </div>
        `;
        document.getElementById("btnRoundNext").addEventListener("click", drawNextRound);
        document.getElementById("btnUndoR").addEventListener("click", undoRound);
        kbd.innerHTML = `快捷键：<span class="kbd">Space</span> 翻面 &nbsp;·&nbsp; <span class="kbd">→</span> 下一签 &nbsp;·&nbsp; <span class="kbd">C</span> 挖空 &nbsp;·&nbsp; <span class="kbd">Z</span> 撤回`;
      } else {
        const b = appState.box;
        area.innerHTML = `
          ${guard}
          <div class="action-row">
            <button id="btnBoxUnfam" class="btn-unfamiliar" type="button" ${locked ? "disabled" : ""}>
              <span>仍陌生 · 高频重抽</span>
              <span class="sub">权重×2.5 · 留陌生盒</span>
            </button>
            <button id="btnBoxMast" class="btn-mastered" type="button" ${locked ? "disabled" : ""}>
              <span>已熟练 · 归档熟练盒</span>
              <span class="sub">不再出现 · 随时可移回</span>
            </button>
          </div>
          <div class="sub-action-row">
            <button id="btnUndoB" class="btn-undo" type="button" ${b.history.length ? "" : "disabled"}>↩ 撤回上一步</button>
            <span style="font-size:11px;color:var(--ink-muted);">双盒累计练习 ${b.drawCount} 次</span>
          </div>
        `;
        document.getElementById("btnBoxUnfam").addEventListener("click", markBoxUnfamiliar);
        document.getElementById("btnBoxMast").addEventListener("click", markBoxMastered);
        document.getElementById("btnUndoB").addEventListener("click", undoBox);
        kbd.innerHTML = `快捷键：<span class="kbd">Space</span> 翻面 &nbsp;·&nbsp; <span class="kbd">←</span> 陌生 &nbsp;·&nbsp; <span class="kbd">→</span> 熟练 &nbsp;·&nbsp; <span class="kbd">C</span> 挖空 &nbsp;·&nbsp; <span class="kbd">Z</span> 撤回`;
      }
    }

    function renderAll() {
      renderTopControls();
      renderStatusBar();
      renderStage();
      renderActionArea();
    }

    /* ==========================================================================
       12. 抽屉：时间轴检索 · 分组差异对比 · 高频专题速查
       ========================================================================== */
    function openDrawer(tab = "timeline", presetQuery = "") {
      uiState.drawerTab = tab;
      document.getElementById("searchInput").value = presetQuery;
      document.getElementById("statusFilter").value = "ALL";
      document.getElementById("drawerModal").classList.add("open");
      renderDrawerContent();
    }

    function closeDrawer() {
      document.getElementById("drawerModal").classList.remove("open");
    }

    function renderDrawerContent() {
      const tab = uiState.drawerTab;
      document.getElementById("dTabTimeline").classList.toggle("active", tab === "timeline");
      document.getElementById("dTabCompare").classList.toggle("active", tab === "compare");
      document.getElementById("dTabSpecial").classList.toggle("active", tab === "special");
      document.getElementById("timelineFilters").style.display = tab === "timeline" ? "flex" : "none";

      const box = document.getElementById("drawerContent");

      // 视图 1：时间轴检索（1921→2024 穿插排列 + 双盒管理 + 跳转抽看）
      if (tab === "timeline") {
        const kw = document.getElementById("searchInput").value.trim().toLowerCase();
        const st = document.getElementById("statusFilter").value;
        const masteredSet = new Set(appState.box.masteredIds);

        const items = SORTED_CARDS.filter(c => {
          const isMastered = masteredSet.has(c.id);
          const isWrong = (appState.wrongCounts[c.id] || 0) > 0;
          if (st === "MEETING" && c.type !== "meeting") return false;
          if (st === "WORK" && c.type !== "work") return false;
          if (st === "HIGH" && !isWrong) return false;
          if (st === "UNFAMILIAR" && isMastered) return false;
          if (st === "MASTERED" && !isMastered) return false;
          if (!kw) return true;
          return (
            c.year.toLowerCase().includes(kw) ||
            c.title.toLowerCase().includes(kw) ||
            c.coreTag.toLowerCase().includes(kw) ||
            c.core.toLowerCase().includes(kw) ||
            c.trap.toLowerCase().includes(kw)
          );
        });

        if (!items.length) {
          box.innerHTML = `<div style="text-align:center;padding:36px;color:var(--ink-muted);font-size:13px;">无匹配卡片</div>`;
          return;
        }

        box.innerHTML = items.map(c => {
          const isMastered = masteredSet.has(c.id);
          const wCnt = appState.wrongCounts[c.id] || 0;
          const expandedCls = kw && items.length <= 2 ? "expanded" : "";
          const corePlain = c.core.replace(/\{\{([^}]+)\}\}/g, `<strong style="color:var(--${c.type});">$1</strong>`);
          return `
            <div class="tl-item ${expandedCls}">
              <div class="tl-top">
                <div class="tl-main">
                  <span class="tl-year">${c.year}</span>
                  <span class="tl-kind ${c.type}">${c.type === "meeting" ? "会议" : "著作"}</span>
                  <span class="tl-name">${c.title}</span>
                  <span class="tl-tag">${c.coreTag}</span>
                  ${wCnt > 0 ? `<span class="priority-badge">🔥 错×${wCnt}</span>` : ""}
                </div>
                <div class="tl-actions">
                  <button class="btn-move jump-btn" data-jump="${c.id}" type="button" title="直接抽看此签">抽看</button>
                  <button class="btn-move ${isMastered ? "to-unfamiliar" : "to-mastered"}" data-mid="${c.id}" data-target="${isMastered ? "unfamiliar" : "mastered"}" type="button">
                    ${isMastered ? "移回陌生" : "标熟练"}
                  </button>
                </div>
              </div>
              <div class="tl-detail">
                <div><strong style="color:var(--navy);">① 必背核心：</strong>${corePlain}</div>
                <div style="margin-top:4px;"><strong>② 次要要点：</strong>${c.secondary}</div>
                <div style="margin-top:4px;color:var(--trap-ink);"><strong>③ 陷阱避坑：</strong>${c.trap}</div>
                <div style="margin-top:4px;color:var(--navy);"><strong>时间链：</strong>${c.chainPrev} → ${c.title} → ${c.chainNext}</div>
              </div>
            </div>
          `;
        }).join("");

        box.querySelectorAll(".tl-main").forEach(el => {
          el.addEventListener("click", () => el.closest(".tl-item").classList.toggle("expanded"));
        });
        box.querySelectorAll("[data-jump]").forEach(btn => {
          btn.addEventListener("click", e => {
            e.stopPropagation();
            jumpToCard(btn.dataset.jump);
          });
        });
        box.querySelectorAll("[data-mid]").forEach(btn => {
          btn.addEventListener("click", e => {
            e.stopPropagation();
            moveBoxItem(btn.dataset.mid, btn.dataset.target);
          });
        });
        return;
      }

      // 视图 2：分组差异对比（会议 7 大系列 + 毛选 6 大阶段）
      if (tab === "compare") {
        const meetingGroups = Object.values(GROUPS).filter(g => g.type === "meeting");
        const workGroups = Object.values(GROUPS).filter(g => g.type === "work");

        const renderGroupCard = g => {
          const members = SORTED_CARDS.filter(c => c.groupId === g.id);
          return `
            <div class="comp-card ${g.type === "meeting" ? "meeting-accent" : "work-accent"}">
              <h4 class="comp-title">${g.name}</h4>
              <div class="comp-mnemonic">口诀：${g.mnemonic}</div>
              <div class="comp-diff"><strong>组内差异：</strong>${g.diff}</div>
              <table class="comp-table">
                ${members.map(m => `
                  <tr>
                    <td class="mono">${m.year}</td>
                    <td class="bold" style="width:34%;">${m.title}</td>
                    <td>${m.coreTag}</td>
                  </tr>
                `).join("")}
              </table>
            </div>
          `;
        };

        box.innerHTML = `
          <div class="comp-section-label">一、32 核心会议 · 7 大系列差异对比</div>
          ${meetingGroups.map(renderGroupCard).join("")}
          <div class="comp-section-label" style="margin-top:8px;">二、25 篇毛选著作 · 6 大阶段差异对比</div>
          ${workGroups.map(renderGroupCard).join("")}
        `;
        return;
      }

      // 视图 3：高频专题速查（黄金配对 + 历次三中全会 + 高频易混辨析）
      const pairingHtml = `
        <div class="comp-card special-accent">
          <h4 class="comp-title">🤝 专题一：会议 × 毛选黄金配对表</h4>
          <table class="comp-table">
            <thead><tr><th style="width:45%;">黄金配对</th><th>核心关联点</th></tr></thead>
            <tbody>
              ${SPECIAL_TOPICS.pairings.map(p => `
                <tr><td class="bold">${p.pair}</td><td>${p.point}</td></tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;

      const plenumsHtml = `
        <div class="comp-card meeting-accent">
          <h4 class="comp-title">🔥 专题二：历次三中全会核心差异速查</h4>
          <div class="comp-mnemonic">口诀：十一届开改开，十二届商品转城市，十四届搭框架，十八届全深改决定性，二十届进一步全深改2029</div>
          <table class="comp-table">
            ${SPECIAL_TOPICS.thirdPlenums.map(p => `
              <tr>
                <td class="mono">${p.year}</td>
                <td class="bold" style="width:28%;">${p.name}</td>
                <td>${p.focus}</td>
              </tr>
            `).join("")}
          </table>
        </div>
      `;

      const confusionsHtml = `
        <div class="comp-card work-accent">
          <h4 class="comp-title">⚠️ 专题三：考研政治高频易混点辨析</h4>
          <div style="display:flex;flex-direction:column;gap:9px;">
            ${SPECIAL_TOPICS.confusions.map(item => `
              <div style="padding:8px 10px;background:var(--bg-paper);border-radius:8px;border:1px solid var(--border);font-size:12.5px;">
                <div style="font-weight:800;color:var(--navy);margin-bottom:3px;">${item.title}</div>
                <div style="color:var(--ink-secondary);line-height:1.55;">${item.detail}</div>
              </div>
            `).join("")}
          </div>
        </div>
      `;

      box.innerHTML = pairingHtml + plenumsHtml + confusionsHtml;
    }

    /* ==========================================================================
       13. 二次确认弹窗与全局事件绑定
       ========================================================================== */
    function openConfirm(title, msg, cb) {
      document.getElementById("confirmTitle").textContent = title;
      document.getElementById("confirmMessage").textContent = msg;
      uiState.confirmCallback = cb;
      document.getElementById("confirmModal").classList.add("open");
    }

    function closeConfirm() {
      document.getElementById("confirmModal").classList.remove("open");
      uiState.confirmCallback = null;
    }

    function switchScope(sc) {
      if (appState.scope === sc) return;
      appState.scope = sc;
      resetCardUI(false);
      uiState.sniperPicked = null;
      saveState();
      renderAll();
    }

    function switchMode(mode) {
      if (appState.activeMode === mode) return;
      appState.activeMode = mode;
      resetCardUI(false);
      uiState.sniperPicked = null;
      saveState();
      renderAll();
    }

    function toggleCloze() {
      appState.clozeMode = !appState.clozeMode;
      uiState.revealedClozeIndexes = new Set();
      saveState();
      showToast(appState.clozeMode ? "挖空自测已开：核心采分点已遮盖" : "挖空自测已关：直接高亮关键词");
      const wasFlipped = uiState.isFlipped;
      renderAll();
      if (wasFlipped) {
        const card = document.getElementById("activeLotCard");
        if (card) card.classList.add("is-flipped");
      }
    }

    function bindEvents() {
      // 番茄钟与沉浸模式
      document.getElementById("btnPomoToggle").addEventListener("click", togglePomo);
      document.getElementById("btnPomoDuration").addEventListener("click", cyclePomoDuration);
      document.getElementById("btnPomoReset").addEventListener("click", resetPomo);
      document.getElementById("btnZenToggle").addEventListener("click", () => {
        appState.zenMode = true;
        renderTopControls();
      });
      document.getElementById("btnExitZen").addEventListener("click", () => {
        appState.zenMode = false;
        renderTopControls();
      });

      // 板块切换
      document.querySelectorAll(".scope-btn").forEach(btn => {
        btn.addEventListener("click", () => switchScope(btn.dataset.scope));
      });

      // 模式切换
      document.getElementById("tabRound").addEventListener("click", () => switchMode("round"));
      document.getElementById("tabBox").addEventListener("click", () => switchMode("box"));
      document.getElementById("tabSniper").addEventListener("click", () => switchMode("sniper"));

      // 工具开关
      document.getElementById("btnClozeToggle").addEventListener("click", toggleCloze);
      document.getElementById("btnBlindToggle").addEventListener("click", () => {
        appState.blindMode = !appState.blindMode;
        saveState();
        showToast(appState.blindMode ? "盲测已开：隐藏正面类型与分组" : "盲测已关：恢复显示");
        const wasFlipped = uiState.isFlipped;
        renderAll();
        if (wasFlipped) {
          const card = document.getElementById("activeLotCard");
          if (card) card.classList.add("is-flipped");
        }
      });
      document.getElementById("btnLockToggle").addEventListener("click", () => {
        appState.antiMistouch = !appState.antiMistouch;
        saveState();
        showToast(appState.antiMistouch ? "防误触锁已开：翻面后解锁底部按钮" : "防误触锁已关");
        renderTopControls();
        renderActionArea();
      });

      // 抽屉
      document.getElementById("btnOpenDrawer").addEventListener("click", () => openDrawer("timeline"));
      document.getElementById("btnCloseDrawer").addEventListener("click", closeDrawer);
      document.getElementById("drawerModal").addEventListener("click", e => { if (e.target === e.currentTarget) closeDrawer(); });
      document.getElementById("dTabTimeline").addEventListener("click", () => { uiState.drawerTab = "timeline"; renderDrawerContent(); });
      document.getElementById("dTabCompare").addEventListener("click", () => { uiState.drawerTab = "compare"; renderDrawerContent(); });
      document.getElementById("dTabSpecial").addEventListener("click", () => { uiState.drawerTab = "special"; renderDrawerContent(); });
      document.getElementById("searchInput").addEventListener("input", renderDrawerContent);
      document.getElementById("statusFilter").addEventListener("change", renderDrawerContent);

      // 重置本模式
      document.getElementById("btnResetMode").addEventListener("click", () => {
        const mode = appState.activeMode;
        const sc = appState.scope;
        if (mode === "round") {
          openConfirm("重置全量轮抽", `确定重置「${getScopeLabel()}」当前轮抽进度并重新洗牌？（不影响其他板块及双盒）`, () => {
            appState.rounds[sc] = createRoundScopeState(sc, appState.rounds[sc].roundOrder);
            resetCardUI(false);
            saveState();
            showToast(`${getScopeLabel()}轮抽已重置`);
            renderAll();
          });
        } else if (mode === "box") {
          openConfirm("重置双盒进度", `确定将「${getScopeLabel()}」的熟练卡片全部移回陌生盒？`, () => {
            const scopeSet = new Set(getScopeIds(sc));
            appState.box.masteredIds = appState.box.masteredIds.filter(id => !scopeSet.has(id));
            scopeSet.forEach(id => delete appState.box.manualUnfamiliarCounts[id]);
            appState.box.currentByScope[sc] = null;
            resetCardUI(false);
            saveState();
            showToast(`${getScopeLabel()}双盒已重置`);
            renderAll();
          });
        } else {
          openConfirm("重置陷阱狙击", "确定清空陷阱狙击作答统计并重新生成题库队列？", () => {
            appState.sniper = createSniperState();
            uiState.sniperPicked = null;
            saveState();
            showToast("陷阱狙击已重置");
            renderAll();
          });
        }
      });

      // 确认弹窗
      document.getElementById("btnCloseConfirm").addEventListener("click", closeConfirm);
      document.getElementById("btnCancelConfirm").addEventListener("click", closeConfirm);
      document.getElementById("confirmModal").addEventListener("click", e => { if (e.target === e.currentTarget) closeConfirm(); });
      document.getElementById("btnDoConfirm").addEventListener("click", () => {
        const cb = uiState.confirmCallback;
        closeConfirm();
        if (typeof cb === "function") cb();
      });

      // 桌面快捷键：Space 翻面、C 挖空、←/→ 标记、Z 撤回
      document.addEventListener("keydown", e => {
        const modalOpen =
          document.getElementById("drawerModal").classList.contains("open") ||
          document.getElementById("confirmModal").classList.contains("open");
        if (modalOpen) {
          if (e.key === "Escape") { closeDrawer(); closeConfirm(); }
          return;
        }
        if (["INPUT", "SELECT"].includes(e.target.tagName)) return;

        const key = e.key.toLowerCase();
        if (key === "c") { e.preventDefault(); toggleCloze(); return; }

        const mode = appState.activeMode;
        const sc = appState.scope;

        if (mode === "sniper") {
          const curId = appState.sniper.currentByScope[sc];
          if (e.code === "Space") {
            e.preventDefault();
            if (!curId || uiState.sniperPicked !== null) nextSniperQuestion();
          } else if (curId && uiState.sniperPicked === null) {
            if (e.key === "ArrowLeft" || key === "1") submitQuizResult(curId, true, true);
            else if (e.key === "ArrowRight" || key === "2") submitQuizResult(curId, false, true);
          }
          return;
        }

        const curId = getCurrentCardId();
        const locked = appState.antiMistouch && !uiState.hasViewedBack;

        if (key === "z") {
          e.preventDefault();
          if (mode === "round") undoRound(); else undoBox();
          return;
        }

        if (e.code === "Space") {
          e.preventDefault();
          if (curId) flipCard();
          else if (mode === "round") getCurRound().roundCompleted ? startNewRound() : drawNextRound();
          else drawFirstBox();
          return;
        }

        if (!curId) return;
        if (mode === "round" && e.key === "ArrowRight") {
          e.preventDefault();
          if (!locked) drawNextRound();
          else showToast("防误触：请先按 Space 翻看背面");
        } else if (mode === "box") {
          if (e.key === "ArrowLeft") {
            e.preventDefault();
            if (!locked) markBoxUnfamiliar();
            else showToast("防误触：请先按 Space 翻看背面");
          } else if (e.key === "ArrowRight") {
            e.preventDefault();
            if (!locked) markBoxMastered();
            else showToast("防误触：请先按 Space 翻看背面");
          }
        }
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      loadState();
      updatePomoUI();
      bindEvents();
      renderAll();
    });
  </script>
</body>
</html>
